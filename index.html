<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Gra TEB Edukacja</title>
    <style>
      /* Reset i Ustawienia Podstawowe */
      html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    height: 100%;
    background-color: #0f172a;
    overflow: hidden; /* Blokuje scrollowanie */
    position: fixed; /* Zapobiega "gumkowaniu" strony na iOS */
    }

    #app {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100dvh; /* Dynamic viewport height */
        
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
    }

    canvas {
        display: block; /* Usuwa dziwne dolne marginesy dla elementów inline */
        max-width: 100%;
        max-height: 100%;
        object-fit: contain; /* Klucz do skalowania */
    }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
